<style>

0}.header-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.sync{font-size:12px;color:var(--muted);white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;margin-right:5px}.dot.online{background:#22c55e}.content{max-width:1500px;margin:0 auto;padding:32px 34px}.page-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:25px}.page-top h2{font-size:28px;margin:0 0 5px;letter-spacing:-.8px}.page-top p{margin:0;color:var(--muted);font-size:14px}.btn{border:1px solid #e2e8f0;border-radius:11px;padding:10px 14px;background:#fff;font-weight:650;color:#334155;display:inline-flex;align-items:center;gap:6px;justify-content:center}.btn:hover{background:#f8fafc}.btn.primary{color:white;background:var(--orange);border-color:var(--orange)}.btn.primary:hover{background:var(--deep)}.btn.danger{color:#dc2626;border-color:#fecaca}.btn.small{padding:6px 10px;font-size:12px}.btn.icon{padding:8px 10px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}.stat,.panel,.item-card{background:white;border:1px solid var(--border);border-radius:19px;box-shadow:var(--shadow)}.stat{padding:20px}.stat small{color:var(--muted);font-weight:600}.stat b{display:block;margin-top:10px;font-size:27px}.stat .sub{color:#ea580c;font-size:12px;margin-top:6px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 20px}.search,.field input,.field select,.field textarea,.toolbar select{background:#f8fafc;border:1px solid #e2e8f0;border-radius:11px;padding:11px 13px;outline:none;color:var(--dark)}.search:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#fb923c;box-shadow:0 0 0 3px #ffedd5}.search{min-width:220px;flex:1;max-width:390px}.toolbar select{min-width:155px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.item-card{padding:19px}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.card-head h3{font-size:16px;margin:0 0 8px}.muted{color:var(--muted);font-size:13px}.tag{display:inline-flex;background:#ffedd5;color:#c2410c;border-radius:99px;font-size:11px;font-weight:700;padding:5px 9px;align-items:center;gap:4px}.tag.neutral{background:#f1f5f9;color:#475569}.tag.warn{background:#fef3c7;color:#92400e}.tag.bad{background:#fee2e2;color:#b91c1c}.tag.good{background:#dcfce7;color:#166534}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.card-actions{display:flex;gap:6px;flex-wrap:wrap}.quantity-row{border-top:1px solid #f1f5f9;margin-top:17px;padding-top:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}.qty-controls{display:flex;align-items:center;gap:9px}.qty-controls b{min-width:26px;text-align:center;font-size:18px}.qty-controls .btn{width:32px;height:32px;padding:0}.empty{text-align:center;padding:48px;color:var(--muted);background:white;border:1px dashed #fdba74;border-radius:18px;grid-column:1/-1}.panel{padding:20px;margin-bottom:18px}.panel h3{margin:0 0 14px}.row-line{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 0;border-top:1px solid #f1f5f9}.row-line:first-of-type{border-top:0}.small-line{margin:7px 0;color:#475569;font-size:13px}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;z-index:30;padding:18px}.modal{background:white;border-radius:20px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #0003;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.modal h2{font-size:22px;margin:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field label{font-size:12px;font-weight:750;color:#475569}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:93px;resize:vertical}.wide{grid-column:1/-1}.modal-footer{display:flex;gap:9px;justify-content:flex-end;margin-top:23px}.kit-line{display:flex;gap:10px;align-items:center;margin:8px 0}.kit-line select{flex:1;min-width:0}.kit-line input{max-width:95px}.notice{padding:11px;background:#fff7ed;border-radius:10px;color:#9a3412;font-size:12px}.mini-table{width:100%;border-collapse:collapse}.mini-table td,.mini-table th{text-align:left;padding:12px;border-bottom:1px solid #f1f5f9;font-size:13px}.mini-table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:white;padding:12px 18px;border-radius:12px;z-index:50;box-shadow:var(--shadow)}.menu-toggle{display:none}@media(max-width:1150px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.sidebar{position:fixed;top:0;bottom:0;left:0;z-index:20;transform:translateX(-100%);width:265px;box-shadow:0 0 50px #0002}.sidebar.mobile-open{transform:translateX(0)}.sidebar.collapsed{width:265px}.sidebar.collapsed .hide-collapse{display:block}.header{padding:12px 16px;height:auto;min-height:70px}.header h1{font-size:15px}.header-actions{gap:5px}.header-actions .btn{padding:7px;font-size:12px}.content{padding:22px 15px}.grid{grid-template-columns:1fr}.cards{gap:10px}.stat{padding:15px}.stat b{font-size:23px}.page-top h2{font-size:24px}.page-top{align-items:center}.menu-toggle{display:inline-flex}.form-grid{grid-template-columns:1fr}.wide{grid-column:1}.modal{padding:18px}.sync{display:none}}
.stock-module-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.stock-module-header h2{font-size:29px;letter-spacing:-.8px;margin:4px 0 6px}.stock-module-header p{font-size:14px;color:var(--muted);margin:0}.module-eyebrow{font-size:10px;font-weight:800;letter-spacing:1.8px;color:#ea580c}.stock-tabs{display:flex;gap:7px;align-items:center;overflow-x:auto;padding:7px;margin-bottom:27px;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);scrollbar-width:thin}.stock-tab{border:0;background:transparent;color:#64748b;padding:12px 19px;white-space:nowrap;border-radius:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px;transition:background .15s,color .15s}.stock-tab:hover{background:#fff7ed;color:#c2410c}.stock-tab.active{background:#ffedd5;color:#c2410c}.stock-tab-icon{font-size:17px}.tab-counter{display:inline-flex;justify-content:center;align-items:center;background:#f97316;color:white;min-width:20px;height:20px;border-radius:20px;font-size:11px;padding:0 5px}.stock-tabs+.page-top h2{font-size:23px}@media(max-width:760px){.stock-tabs{margin-bottom:21px}.stock-tab{padding:12px 14px}.stock-module-header h2{font-size:25px}.stock-module-header p{line-height:1.5}}</style>

<body>
<div class="app"><aside id="sidebar" class="sidebar"><div class="brand"><div class="logo">F</div><div class="hide-collapse"><strong>Fiji Admin</strong><small>Mandir Seva Hub</small></div></div><div class="section-label hide-collapse">APPLICATION MODULES</div><nav id="nav-modules"></nav><div class="sidebar-bottom hide-collapse">Fiji Administration · v1.0<br><span id="storage-label">Saved on this device</span></div></aside><div class="main"><header class="header"><div style="display:flex;align-items:center;gap:9px"><button class="btn icon menu-toggle" id="menuBtn" aria-label="Open menu">☰</button><button class="btn icon" id="collapseBtn" aria-label="Collapse sidebar">☷</button><h1>Fiji Administration</h1></div><div class="header-actions"><span class="sync"><span id="statusDot" class="dot"></span><span id="statusText">Local mode</span></span><button class="btn icon" id="undoBtn" title="Undo">↶</button><button class="btn icon" id="redoBtn" title="Redo">↷</button><button class="btn" id="exportBtn">↓ Export</button><button class="btn" id="importBtn">↑ Import</button><input id="importFile" type="file" accept="application/json" hidden></div></header><main id="content" class="content"></main></div></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script type="module">
// OPTIONAL FIREBASE SETUP: Fill in your Firebase project's web app configuration below.
// Enable Firestore and allow only authenticated users access using Firestore security rules.
// This application uses anonymous authentication when enabled; for shared multi-device data,
// set a strong shared workspace ID AND implement real sign-in/access controls in production.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBxpZ-8bBd3Aic4b2JS47uA-OrTDvLjO3w",
  authDomain: "fiji-administration.firebaseapp.com",
  projectId: "fiji-administration",
  storageBucket: "fiji-administration.firebasestorage.app",
  messagingSenderId: "826878054210",
  appId: "1:826878054210:web:16af88c1597e937dec42db",
  measurementId: "G-THF9HZ0369"
};
const WORKSPACE_ID = 'mandir-seva-hub';
const STORAGE_KEY='fiji-admin-v1';
const defaults={categories:['Pooja Supplies','Mala & Kanthi','Murtis & Frames','Electronics'],inventory:[{id:'1',name:'Cotton Wicks',category:'Pooja Supplies',location:'Cupboard A',qty:45,min:20}],kits:[{id:'k1',name:'Ghar Sabha Kit',count:3,items:[{id:'1',qty:5}]}],orders:[{id:'o1',itemId:'1',name:'Cotton Wicks',qty:50}],flights:[{id:'f1',name:'Raj Patel',departure:'2026-11-05',returnDate:'2026-11-20',details:'Flight QF151, PNR: XYZ123'}],tripDetails:[{id:'t1',dateTitle:'12 Oct 26',dateVal:'2026-10-12',attendees:['Raj Patel','Kirit Shah'],description:'Mandir deep clean and audio check.',stockUsed:[],reported:false}],projects:[{id:'p1',name:'Mandir Sound Upgrade',dates:'Oct - Nov 26',isOngoing:false,details:'Replace main amplifier rack.',notes:'Speakers ordered.'}]};
const clone=v=>JSON.parse(JSON.stringify(v));const id=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());
let state;try{state={...clone(defaults),...JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}}catch{state=clone(defaults)}
let active='inventory',search='',filter='all',history=[],future=[],modal=null,cloud=null,syncTimer=null,remoteApplying=false;
const $=sel=>document.querySelector(sel),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}):'Not set';
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const daysUntil=date=>Math.ceil((new Date(date+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);
const findItem=id=>state.inventory.find(i=>i.id===id);
const low=i=>Number(i.qty)<=Number(i.min);
function commit(fn){history.push(clone(state));if(history.length>40)history.shift();future=[];fn();persist();render()}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));updateControls();if(cloud&&!remoteApplying){$('#statusText').textContent='Syncing…';clearTimeout(syncTimer);syncTimer=setTimeout(()=>cloud.save(clone(state)),450)}}
function notify(message){const root=$('#toastRoot');root.innerHTML=`<div class="toast">${esc(message)}</div>`;setTimeout(()=>root.innerHTML='',3000)}
function updateControls(){ $('#undoBtn').disabled=!history.length;$('#redoBtn').disabled=!future.length }
$('#undoBtn').onclick=()=>{if(!history.length)return;future.push(clone(state));state=history.pop();persist();render()};$('#redoBtn').onclick=()=>{if(!future.length)return;history.push(clone(state));state=future.pop();persist();render()};
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`fiji-admin-${today()}.json`;a.click();URL.revokeObjectURL(url)};
$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.inventory)||!Array.isArray(data.orders)||!Array.isArray(data.projects))throw Error('Invalid backup');if(confirm('Replace all existing data with this backup?'))commit(()=>state={...clone(defaults),...data});notify('Backup imported')}catch(ex){alert('Unable to import: '+ex.message)}e.target.value=''};
$('#collapseBtn').onclick=()=>$('#sidebar').classList.toggle('collapsed');$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('mobile-open');
const stockTabs=[['inventory','▦','Inventory'],['kits','▣','Seva Kits'],['orders','◫','To Order'],['locations','⌖','Locations']];
const modules=[['stock','▦','Stock Management'],['flights','✈','Flight Info'],['trips','▤','Trip Details'],['projects','▥','Projects']];
const isStockPage=()=>stockTabs.some(([key])=>key===active);
function renderNav(){
  $('#nav-modules').innerHTML=modules.map(([key,icon,name])=>`<button class="nav-btn ${(key==='stock'?isStockPage():active===key)?'active':''}" data-page="${key}" title="${name}"><span class="nav-icon">${icon}</span><span class="nav-name hide-collapse">${name}</span>${key==='stock'&&state.orders.length?`<span class="counter hide-collapse">${state.orders.length}</span>`:''}</button>`).join('');
  document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{active=b.dataset.page==='stock'?'inventory':b.dataset.page;search='';filter='all';$('#sidebar').classList.remove('mobile-open');render()});
}
function stockNavigation(){return `<div class="stock-module-header"><div><div class="module-eyebrow">FIJI ADMINISTRATION</div><h2>Stock Management</h2><p>Manage supplies, prepare Seva Kits, track orders and find storage locations.</p></div></div><nav class="stock-tabs" aria-label="Stock management sections">${stockTabs.map(([key,icon,label])=>`<button type="button" class="stock-tab ${active===key?'active':''}" data-stock-tab="${key}" ${active===key?'aria-current="page"':''}><span class="stock-tab-icon">${icon}</span>${label}${key==='orders'&&state.orders.length?`<span class="tab-counter">${state.orders.length}</span>`:''}</button>`).join('')}</nav>`}

const head=(title,subtitle,button,action)=>`<div class="page-top"><div><h2>${title}</h2><p>${subtitle}</p></div>${button?`<button class="btn primary" data-action="${action}">+ ${button}</button>`:''}</div>`;
const empty=txt=>`<div class="empty">${esc(txt)}</div>`;
const button=(act,label,id='',extra='')=>`<button class="btn small ${extra}" data-action="${act}" data-id="${esc(id)}">${label}</button>`;
function stats(){return `<div class="cards"><div class="stat"><small>Inventory Items</small><b>${state.inventory.length}</b><div class="sub">Across ${new Set(state.inventory.map(i=>i.location)).size} locations</div></div><div class="stat"><small>Low Stock Items</small><b>${state.inventory.filter(low).length}</b><div class="sub">Need attention</div></div><div class="stat"><small>Pending Orders</small><b>${state.orders.length}</b><div class="sub">Awaiting delivery</div></div><div class="stat"><small>Seva Kits</small><b>${state.kits.reduce((n,k)=>n+Number(k.count||0),0)}</b><div class="sub">Assembled kits</div></div></div>`}
function renderInventory(){const items=state.inventory.filter(i=>(i.name+' '+i.category+' '+i.location).toLowerCase().includes(search.toLowerCase())&&(filter==='all'||(filter==='low'&&low(i))||i.category===filter));return head('Inventory','Manage stock quantities, categories and storage locations.','Add Item','add-inventory')+stats()+`<div class="toolbar"><input class="search" data-search placeholder="Search inventory…" value="${esc(search)}"><select data-filter><option value="all">All categories</option><option value="low" ${filter==='low'?'selected':''}>Low stock only</option>${state.categories.map(c=>`<option ${filter===c?'selected':''}>${esc(c)}</option>`).join('')}</select>${button('categories','Edit Categories')}</div><div class="grid">${items.length?items.map(i=>`<article class="item-card"><div class="card-head"><div><h3>${esc(i.name)}</h3><div class="muted">${esc(i.category)}</div></div><div class="card-actions">${button('edit-inventory','Edit',i.id)}${button('delete-inventory','×',i.id,'danger')}</div></div><div class="tags"><span class="tag">⌖ ${esc(i.location||'Unassigned')}</span>${low(i)?'<span class="tag bad">Low Stock</span>':'<span class="tag good">In Stock</span>'}</div><div class="quantity-row"><div><div class="muted">Quantity <span style="font-size:11px">· Min ${Number(i.min)||0}</span></div><div class="qty-controls">${button('decrease','−',i.id)}<b>${Number(i.qty)||0}</b>${button('increase','+',i.id)}</div></div>${button('order-item','Order +',i.id)}</div></article>`).join(''):empty('No inventory items match your search.')}</div>`}
function renderKits(){return head('Seva Kits','Track kit contents and assembled quantities.','Add Kit','add-kit')+`<div class="grid">${state.kits.length?state.kits.map(k=>`<article class="item-card"><div class="card-head"><div><h3>${esc(k.name)}</h3><span class="tag neutral">${k.items.length} item types</span></div><div class="card-actions">${button('edit-kit','Edit',k.id)}${button('delete-kit','×',k.id,'danger')}</div></div><div style="margin:15px 0">${k.items.length?k.items.map(it=>`<div class="small-line">${esc(findItem(it.id)?.name||'Deleted item')} <strong>× ${Number(it.qty)||0}</strong></div>`).join(''):'<div class="muted">No kit contents added</div>'}</div><div class="quantity-row"><span class="muted">Assembled kits</span><div class="qty-controls">${button('kit-decrease','−',k.id)}<b>${k.count||0}</b>${button('kit-increase','+',k.id)}</div></div></article>`).join(''):empty('No kits yet. Add your first seva kit.')}</div>`}
function renderOrders(){return head('To Order','Keep track of items to procure and receive.','Add Order','add-order')+`<div class="panel"><h3>Pending Orders <span class="tag">${state.orders.length}</span></h3>${state.orders.length?state.orders.map(o=>`<div class="row-line"><div><strong>${esc(o.name)}</strong><div class="muted">Quantity ordered: ${o.qty} ${o.itemId&&findItem(o.itemId)?'· Linked to inventory':'· New item'}</div></div><div class="card-actions">${button('deliver-order','✓ Delivered & Add to Stock',o.id,'primary')}${button('edit-order','Edit',o.id)}${button('delete-order','×',o.id,'danger')}</div></div>`).join(''):empty('No pending orders. You’re all caught up.')}</div>`}
function renderLocations(){const groups={};state.inventory.forEach(i=>(groups[i.location||'Unassigned']??=[]).push(i));return head('Locations','Find exactly where supplies are stored.','Add Item','add-inventory')+`<div class="grid">${Object.entries(groups).length?Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0])).map(([loc,items])=>`<div class="item-card"><h3>⌖ ${esc(loc)}</h3><p class="muted">${items.length} item types</p>${items.map(i=>`<div class="row-line"><span>${esc(i.name)}</span><span class="tag ${low(i)?'bad':'neutral'}">${i.qty} left</span></div>`).join('')}</div>`).join(''):empty('Add inventory items with a location to see them here.')}</div>`}
function renderFlights(){const items=state.flights.filter(f=>(f.name+' '+f.details).toLowerCase().includes(search.toLowerCase())).sort((a,b)=>a.departure.localeCompare(b.departure));return head('Flight Info','Keep volunteer travel and booking information organised.','Add Flight','add-flight')+`<div class="toolbar"><input class="search" data-search placeholder="Search travellers or bookings…" value="${esc(search)}"></div><div class="grid">${items.length?items.map(f=>{const n=daysUntil(f.departure);return `<article class="item-card"><div class="card-head"><h3>${esc(f.name)}</h3><div class="card-actions">${button('edit-flight','Edit',f.id)}${button('delete-flight','×',f.id,'danger')}</div></div><div class="tags">${n>=0&&n<=7?'<span class="tag warn">Departing Soon</span>':''}${n<0?'<span class="tag neutral">Departed</span>':''}</div><p class="small-line"><strong>Departure:</strong> ${fmt(f.departure)}</p><p class="small-line"><strong>Return:</strong> ${fmt(f.returnDate)}</p><p class="muted" style="white-space:pre-wrap">${esc(f.details)}</p></article>`}).join(''):empty('No flights found.')}</div>`}
function renderTrips(){const items=state.tripDetails.filter(t=>filter==='all'||(filter==='upcoming'&&daysUntil(t.dateVal)>=0&&daysUntil(t.dateVal)<=21)||(filter==='reported'&&t.reported)).filter(t=>(t.dateTitle+' '+t.description+' '+t.attendees.join(' ')).toLowerCase().includes(search.toLowerCase())).sort((a,b)=>b.dateVal.localeCompare(a.dateVal));return head('Trip Details','Plan visits, record activities and account for stock usage.','Add Trip','add-trip')+`<div class="toolbar"><input class="search" data-search placeholder="Search trips…" value="${esc(search)}"><select data-filter><option value="all">All Trips</option><option value="upcoming" ${filter==='upcoming'?'selected':''}>Upcoming Trips (21 days)</option><option value="reported" ${filter==='reported'?'selected':''}>Website Reported</option></select></div><div class="grid">${items.length?items.map(t=>`<article class="item-card"><div class="card-head"><div><h3>${esc(t.dateTitle||fmt(t.dateVal))}</h3><div class="muted">${fmt(t.dateVal)}</div></div><div class="card-actions">${button('edit-trip','Edit',t.id)}${button('delete-trip','×',t.id,'danger')}</div></div><div class="tags"><span class="tag ${t.reported?'good':'warn'}">${t.reported?'Website Reported':'Report Pending'}</span>${t.attendees.map(a=>`<span class="tag neutral">${esc(a)}</span>`).join('')}</div><p class="small-line" style="white-space:pre-wrap">${esc(t.description)}</p><p class="muted">Stock used: ${(t.stockUsed||[]).length?(t.stockUsed||[]).map(u=>`${esc(findItem(u.id)?.name||u.name||'Item')} × ${u.qty}`).join(', '):'None'}</p>${button('toggle-reported',t.reported?'Mark Unreported':'Mark Website Reported',t.id)}</article>`).join(''):empty('No trips match this filter.')}</div>`}
function renderProjects(){return head('Projects','Monitor ongoing Mandir and Centre initiatives.','Add Project','add-project')+`<div class="grid">${state.projects.length?state.projects.map(p=>`<article class="item-card"><div class="card-head"><h3>${esc(p.name)}</h3><div class="card-actions">${button('edit-project','Edit',p.id)}${button('delete-project','×',p.id,'danger')}</div></div><div class="tags"><span class="tag ${p.isOngoing?'good':'neutral'}">${p.isOngoing?'Ongoing':esc(p.dates||'No dates')}</span></div><p class="small-line" style="white-space:pre-wrap">${esc(p.details)}</p><div style="background:#f8fafc;padding:12px;border-radius:12px;margin-top:14px"><strong style="font-size:12px">Progress notes</strong><p class="muted" style="white-space:pre-wrap;margin-bottom:0">${esc(p.notes||'No progress notes yet.')}</p></div></article>`).join(''):empty('No projects yet.')}</div>`}
const views={inventory:renderInventory,kits:renderKits,orders:renderOrders,locations:renderLocations,flights:renderFlights,trips:renderTrips,projects:renderProjects};
function render(){renderNav();$('#content').innerHTML=(isStockPage()?stockNavigation():'')+views[active]();document.querySelectorAll('[data-stock-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.stockTab;search='';filter='all';render()});document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action,b.dataset.id)));const s=$('[data-search]');if(s)s.oninput=e=>{const pos=e.target.selectionStart;search=e.target.value;render();const el=$('[data-search]');el.focus();el.setSelectionRange(pos,pos)};const f=$('[data-filter]');if(f)f.onchange=e=>{filter=e.target.value;render()};updateControls()}
function field(label,name,value='',type='text',extra=''){return `<div class="field ${extra}"><label for="f_${name}">${esc(label)}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="1"':''}></div>`}
function textarea(label,name,value='',extra='wide'){return `<div class="field ${extra}"><label for="f_${name}">${esc(label)}</label><textarea id="f_${name}" name="${name}">${esc(value)}</textarea></div>`}
function select(label,name,options,chosen='',extra=''){return `<div class="field ${extra}"><label for="f_${name}">${esc(label)}</label><select id="f_${name}" name="${name}">${options.map(o=>`<option value="${esc(o)}" ${o===chosen?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function openModal(title,body,submit,saveLabel='Save Changes'){modal={submit};$('#modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="btn icon" id="closeModal">✕</button></div><form id="editForm"><div class="form-grid">${body}</div><div class="modal-footer"><button class="btn" type="button" id="cancelModal">Cancel</button><button class="btn primary" type="submit">${esc(saveLabel)}</button></div></form></div></div>`;$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;$('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()};$('#editForm').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{submit(data,e.target)}catch(err){alert(err.message)}}}
function closeModal(){modal=null;$('#modalRoot').innerHTML=''};
const required=(v,label)=>{if(!String(v||'').trim())throw Error(label+' is required');return String(v).trim()};const nonneg=v=>Math.max(0,Math.floor(Number(v)||0));
function inventoryForm(item){let i=item||{};openModal(item?'Edit Inventory Item':'Add Inventory Item',field('Item Name','name',i.name,'text','wide')+select('Category','category',[...new Set([...state.categories,i.category].filter(Boolean))],i.category)+field('Storage Location','location',i.location||'Cupboard A')+field('Quantity','qty',i.qty??0,'number')+field('Minimum Quantity','min',i.min??0,'number'),d=>{commit(()=>{const obj={id:item?.id||id(),name:required(d.name,'Item name'),category:d.category,location:required(d.location,'Location'),qty:nonneg(d.qty),min:nonneg(d.min)};if(item)Object.assign(item,obj);else state.inventory.push(obj)});closeModal()})}
function orderForm(order,item){const orig=order||{},initialId=item?.id||orig.itemId||'';const optionIds=state.inventory.map(i=>i.id);openModal(order?'Edit Order':'Add Order',`<div class="field wide"><label>Inventory Item</label><select name="itemId" id="orderItem"><option value="">New / unlisted item</option>${state.inventory.map(i=>`<option value="${esc(i.id)}" ${initialId===i.id?'selected':''}>${esc(i.name)}</option>`).join('')}</select></div>`+field('Order Name','name',item?.name||orig.name||'','text','wide')+field('Quantity To Order','qty',orig.qty||1,'number'),d=>{const itemRef=findItem(d.itemId);commit(()=>{const obj={id:order?.id||id(),itemId:itemRef?.id||null,name:itemRef?.name||required(d.name,'Order name'),qty:Math.max(1,nonneg(d.qty))};if(order)Object.assign(order,obj);else state.orders.push(obj)});closeModal()});$('#orderItem').onchange=e=>{const selected=findItem(e.target.value);if(selected)$('#f_name').value=selected.name}}
function kitForm(kit){const k=kit||{items:[]};openModal(kit?'Edit Seva Kit':'Add Seva Kit',field('Kit Name','name',k.name||'','text','wide')+field('Assembled Count','count',k.count??0,'number','wide')+`<div class="field wide"><label>Kit Contents (per kit)</label><div id="kitRows"></div><button type="button" class="btn small" id="addKitRow">+ Add Item</button></div>`,(d,form)=>{const items=[...form.querySelectorAll('.kit-line')].map(r=>({id:r.querySelector('select').value,qty:nonneg(r.querySelector('input').value)})).filter(v=>v.id&&v.qty>0);commit(()=>{const obj={id:kit?.id||id(),name:required(d.name,'Kit name'),count:nonneg(d.count),items};if(kit)Object.assign(kit,obj);else state.kits.push(obj)});closeModal()});const addRow=(it={})=>{const row=document.createElement('div');row.className='kit-line';row.innerHTML=`<select>${state.inventory.map(i=>`<option value="${esc(i.id)}" ${it.id===i.id?'selected':''}>${esc(i.name)}</option>`).join('')}</select><input aria-label="Quantity per kit" type="number" min="1" value="${it.qty||1}"><button type="button" class="btn small danger">×</button>`;row.querySelector('button').onclick=()=>row.remove();$('#kitRows').append(row)};k.items.forEach(addRow);$('#addKitRow').onclick=()=>{if(!state.inventory.length)return alert('Add an inventory item first');addRow()}}
function flightForm(flight){const f=flight||{};openModal(flight?'Edit Flight':'Add Flight',field('Traveller Name','name',f.name||'','text','wide')+field('Departure Date','departure',f.departure||today(),'date')+field('Return Date','returnDate',f.returnDate||'','date')+textarea('Ticket / Booking Details (PNR, baggage, etc.)','details',f.details||''),d=>{if(d.returnDate&&d.returnDate<d.departure)throw Error('Return must be on or after departure');commit(()=>{const o={id:flight?.id||id(),name:required(d.name,'Traveller name'),departure:required(d.departure,'Departure date'),returnDate:d.returnDate,details:d.details.trim()};if(flight)Object.assign(flight,o);else state.flights.push(o)});closeModal()})}
function tripForm(trip){const t=trip||{};const stock=t.stockUsed||[];openModal(trip?'Edit Trip':'Add Trip',field('Trip Title (e.g. 12 Oct 26)','dateTitle',t.dateTitle||'','text','wide')+field('Actual Start Date','dateVal',t.dateVal||today(),'date','wide')+field('Attendees (comma-separated)','attendees',(t.attendees||[]).join(', '),'text','wide')+textarea('Trip Summary & Activities','description',t.description||'')+`<div class="field wide"><label>Stock Used (deducted from inventory on save)</label><div id="stockRows"></div><button class="btn small" type="button" id="addStockRow">+ Add Used Item</button><div class="notice" style="margin-top:8px">Editing a trip adjusts inventory by the difference from its previously recorded stock use.</div></div><div class="field wide"><label><input type="checkbox" name="reported" ${t.reported?'checked':''} style="width:auto"> Website Reported</label></div>`,(d,form)=>{const used=[...form.querySelectorAll('.stock-line')].map(r=>({id:r.querySelector('select').value,qty:nonneg(r.querySelector('input').value)})).filter(x=>x.id&&x.qty>0);const sums=rows=>rows.reduce((m,x)=>(m[x.id]=(m[x.id]||0)+x.qty,m),{});const old=sums(t.stockUsed||[]),now=sums(used);for(const itemId of new Set([...Object.keys(old),...Object.keys(now)])){const item=findItem(itemId);if(item&&(item.qty+(old[itemId]||0)-(now[itemId]||0)<0))throw Error(`Insufficient stock for ${item.name}`)}commit(()=>{for(const itemId of new Set([...Object.keys(old),...Object.keys(now)])){const item=findItem(itemId);if(item)item.qty+= (old[itemId]||0)-(now[itemId]||0)}const obj={id:trip?.id||id(),dateTitle:required(d.dateTitle,'Trip title'),dateVal:required(d.dateVal,'Start date'),attendees:d.attendees.split(',').map(x=>x.trim()).filter(Boolean),description:d.description.trim(),stockUsed:used,reported:form.querySelector('[name="reported"]').checked};if(trip)Object.assign(trip,obj);else state.tripDetails.push(obj)});closeModal()});const addRow=(it={})=>{if(!state.inventory.length)return alert('Add inventory first');const row=document.createElement('div');row.className='kit-line stock-line';row.innerHTML=`<select>${state.inventory.map(i=>`<option value="${esc(i.id)}" ${it.id===i.id?'selected':''}>${esc(i.name)} (${i.qty} available)</option>`).join('')}</select><input type="number" min="1" aria-label="Stock used" value="${it.qty||1}"><button class="btn small danger" type="button">×</button>`;row.querySelector('button').onclick=()=>row.remove();$('#stockRows').append(row)};stock.forEach(addRow);$('#addStockRow').onclick=()=>addRow()}
function projectForm(project){const p=project||{};openModal(project?'Edit Project':'Add Project',field('Project Name','name',p.name||'','text','wide')+field('Date Range','dates',p.dates||'','text','wide')+`<div class="field wide"><label><input type="checkbox" name="isOngoing" ${p.isOngoing?'checked':''} style="width:auto"> Ongoing project</label></div>`+textarea('Project Description','details',p.details||'')+textarea('Progress Notes','notes',p.notes||''), (d,form)=>{commit(()=>{const obj={id:project?.id||id(),name:required(d.name,'Project name'),dates:d.dates.trim(),isOngoing:form.querySelector('[name="isOngoing"]').checked,details:d.details.trim(),notes:d.notes.trim()};if(project)Object.assign(project,obj);else state.projects.push(obj)});closeModal()})}
function categoryForm(){openModal('Edit Categories',textarea('Categories (one per line)','categories',state.categories.join('\n')),(d)=>{const arr=[...new Set(d.categories.split('\n').map(x=>x.trim()).filter(Boolean))];if(!arr.length)throw Error('At least one category is required');commit(()=>{state.categories=arr});closeModal()})}
function remove(which,id){const obj=state[which].find(x=>x.id===id);if(!obj)return;if(!confirm(`Delete ${obj.name||obj.dateTitle||'this record'}?`))return;commit(()=>{if(which==='tripDetails'){for(const u of obj.stockUsed||[]){const i=findItem(u.id);if(i)i.qty+=nonneg(u.qty)}}state[which]=state[which].filter(x=>x.id!==id)});notify('Deleted')}
function action(act,identifier){const inv=findItem(identifier),kit=state.kits.find(k=>k.id===identifier),ord=state.orders.find(o=>o.id===identifier),flight=state.flights.find(f=>f.id===identifier),trip=state.tripDetails.find(t=>t.id===identifier),project=state.projects.find(p=>p.id===identifier);switch(act){case'add-inventory':inventoryForm();break;case'edit-inventory':inventoryForm(inv);break;case'delete-inventory':remove('inventory',identifier);break;case'increase':case'decrease':if(inv)commit(()=>inv.qty=Math.max(0,inv.qty+(act==='increase'?1:-1)));break;case'order-item':orderForm(null,inv);break;case'categories':categoryForm();break;case'add-kit':kitForm();break;case'edit-kit':kitForm(kit);break;case'delete-kit':remove('kits',identifier);break;case'kit-increase':case'kit-decrease':if(kit)commit(()=>kit.count=Math.max(0,Number(kit.count)+(act==='kit-increase'?1:-1)));break;case'add-order':orderForm();break;case'edit-order':orderForm(ord);break;case'delete-order':remove('orders',identifier);break;case'deliver-order':if(!ord)return;if(!confirm(`Mark ${ord.qty} × ${ord.name} delivered and add to inventory?`))return;commit(()=>{const item=findItem(ord.itemId);if(item)item.qty+=nonneg(ord.qty);else state.inventory.push({id:id(),name:ord.name,category:state.categories[0]||'Other',location:'Unassigned',qty:nonneg(ord.qty),min:0});state.orders=state.orders.filter(o=>o.id!==ord.id)});notify('Delivery added to stock');break;case'add-flight':flightForm();break;case'edit-flight':flightForm(flight);break;case'delete-flight':remove('flights',identifier);break;case'add-trip':tripForm();break;case'edit-trip':tripForm(trip);break;case'delete-trip':remove('tripDetails',identifier);break;case'toggle-reported':if(trip)commit(()=>trip.reported=!trip.reported);break;case'add-project':projectForm();break;case'edit-project':projectForm(project);break;case'delete-project':remove('projects',identifier);break}}
// Firebase integration uses a single Firestore document for this small workspace.
// This is last-write-wins cloud synchronization, not conflict-free concurrent editing.
// Do not open Firestore rules to the public. Configure Authentication and strict rules.
async function initializeFirebase(){if(!FIREBASE_CONFIG)return;try{const[{initializeApp},{getFirestore,doc,onSnapshot,setDoc},{getAuth,signInAnonymously}]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js')]);const app=initializeApp(FIREBASE_CONFIG),db=getFirestore(app),auth=getAuth(app);await signInAnonymously(auth);const ref=doc(db,'workspaces',WORKSPACE_ID);let first=true;cloud={save:async data=>{try{await setDoc(ref,{data,updatedAt:Date.now()});$('#statusText').textContent='Cloud synced';$('#statusDot').classList.add('online')}catch(e){$('#statusText').textContent='Sync failed · local saved';console.error(e)}}};onSnapshot(ref,snap=>{if(snap.exists()){const remote=snap.data().data;if(remote&&typeof remote==='object'&&Array.isArray(remote.inventory)){if(first||JSON.stringify(remote)!==JSON.stringify(state)){remoteApplying=true;state={...clone(defaults),...remote};localStorage.setItem(STORAGE_KEY,JSON.stringify(state));history=[];future=[];render();remoteApplying=false}}}else if(first)cloud.save(clone(state));first=false;$('#statusText').textContent='Cloud synced';$('#statusDot').classList.add('online');$('#storage-label').textContent='Firebase cloud + offline cache'},err=>{$('#statusText').textContent='Offline · local saved';console.error(err)})}catch(err){console.error('Firebase initialization failed',err);$('#statusText').textContent='Local mode · Firebase unavailable'}}
render();initializeFirebase();
</script>
