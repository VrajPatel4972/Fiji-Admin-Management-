<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fiji Admin Management</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        orange: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            300: '#fdba74',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        /* Custom scrollbar for horizontal tabs on mobile */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-orange-50/40 min-h-screen text-slate-800 flex flex-col antialiased">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-[90vw] sm:max-w-sm"></div>

    <!-- Main Header -->
    <header class="bg-white border-b border-orange-100 px-4 sm:px-6 py-3.5 flex justify-between items-center sticky top-0 z-30 shadow-sm">
        <div class="flex items-center gap-2 sm:gap-3">
            <button id="toggle-sidebar" class="p-2 hover:bg-orange-50 text-orange-600 rounded-xl transition-colors active:scale-95">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <h1 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight">Fiji Admin Management</h1>
        </div>
        
        <!-- Discrete Import / Export Controls -->
        <div class="flex items-center gap-1.5 sm:gap-2">
            <button id="btn-export" class="flex items-center gap-1.5 bg-orange-50 text-orange-700 hover:bg-orange-100 border border-orange-200 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all active:scale-95">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Export</span>
            </button>
            <button id="btn-import-trigger" class="flex items-center gap-1.5 bg-orange-50 text-orange-700 hover:bg-orange-100 border border-orange-200 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all active:scale-95">
                <i data-lucide="upload" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Import</span>
            </button>
            <input type="file" id="file-import" accept=".json" class="hidden">
        </div>
    </header>

    <div class="flex flex-1 relative overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="w-64 bg-white border-r border-orange-100 p-4 absolute md:relative z-20 h-full transition-all duration-300 transform -translate-x-full md:translate-x-0 shadow-lg md:shadow-none flex flex-col justify-between">
            <nav class="space-y-1.5">
                <p class="px-3 text-xs font-bold text-orange-400 uppercase tracking-wider mb-2">Modules</p>
                <button id="nav-stock" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm text-orange-700 bg-orange-100/70 border border-orange-200/50 transition-all">
                    <i data-lucide="package" class="w-4 h-4"></i>
                    <span>Stock Management</span>
                </button>
                <button id="nav-trips" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm text-slate-600 hover:bg-orange-50 hover:text-orange-600 transition-all">
                    <i data-lucide="plane" class="w-4 h-4"></i>
                    <span>Seva Trips</span>
                </button>
            </nav>
            <div class="pt-4 border-t border-slate-100 text-center">
                <span class="text-xs text-slate-400 font-medium">BAPS Fiji Operations</span>
            </div>
        </aside>

        <!-- Overlay for Mobile Sidebar -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-10 hidden md:hidden"></div>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full">
            
            <!-- SECTION 1: STOCK MANAGEMENT -->
            <section id="section-stock" class="space-y-6">
                
                <!-- Stock Tabs (Scrollable on Mobile) -->
                <div class="flex border-b border-orange-100 overflow-x-auto no-scrollbar gap-2 pb-1">
                    <button id="tab-inventory" class="stock-tab active flex items-center gap-2 px-4 py-2.5 text-sm font-semibold text-orange-600 border-b-2 border-orange-500 whitespace-nowrap">
                        <i data-lucide="boxes" class="w-4 h-4"></i> Inventory
                    </button>
                    <button id="tab-kits" class="stock-tab flex items-center gap-2 px-4 py-2.5 text-sm font-semibold text-slate-500 hover:text-orange-600 border-b-2 border-transparent whitespace-nowrap">
                        <i data-lucide="archive" class="w-4 h-4"></i> Kits
                    </button>
                    <button id="tab-order" class="stock-tab flex items-center gap-2 px-4 py-2.5 text-sm font-semibold text-slate-500 hover:text-orange-600 border-b-2 border-transparent whitespace-nowrap">
                        <i data-lucide="shopping-cart" class="w-4 h-4"></i> To Order
                        <span id="badge-order-count" class="bg-orange-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold hidden">0</span>
                    </button>
                    <button id="tab-locations" class="stock-tab flex items-center gap-2 px-4 py-2.5 text-sm font-semibold text-slate-500 hover:text-orange-600 border-b-2 border-transparent whitespace-nowrap">
                        <i data-lucide="map-pin" class="w-4 h-4"></i> Locations
                    </button>
                </div>

                <!-- SUB-TAB 1: INVENTORY -->
                <div id="view-inventory" class="space-y-4">
                    <!-- Action Bar -->
                    <div class="flex flex-col sm:flex-row gap-3 justify-between items-stretch sm:items-center bg-white p-4 rounded-2xl border border-orange-100 shadow-sm">
                        <div class="flex flex-1 flex-col sm:flex-row gap-2">
                            <div class="relative flex-1">
                                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
                                <input type="text" id="search-inventory" placeholder="Search inventory..." class="w-full pl-10 pr-4 py-2 bg-slate-50 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400/50">
                            </div>
                            <select id="filter-category" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-600 focus:outline-none focus:ring-2 focus:ring-orange-400/50">
                                <option value="ALL">All Categories</option>
                            </select>
                        </div>
                        <div class="flex gap-2">
                            <button id="btn-manage-cat" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-orange-50 text-orange-700 hover:bg-orange-100 border border-orange-200 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all">
                                <i data-lucide="tags" class="w-4 h-4"></i> Categories
                            </button>
                            <button id="btn-add-item" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-orange-500 text-white hover:bg-orange-600 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all shadow-sm shadow-orange-500/20">
                                <i data-lucide="plus" class="w-4 h-4"></i> Add Item
                            </button>
                        </div>
                    </div>

                    <!-- Inventory Items (Card List on Mobile, Table on Desktop) -->
                    <div class="bg-white rounded-2xl border border-orange-100 shadow-sm overflow-hidden">
                        <div id="inventory-list" class="divide-y divide-orange-50">
                            <!-- Items populated dynamically -->
                        </div>
                    </div>
                </div>

                <!-- SUB-TAB 2: KITS -->
                <div id="view-kits" class="space-y-4 hidden">
                    <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-orange-100 shadow-sm">
                        <h2 class="text-base font-bold text-slate-800">Kit Assemblies</h2>
                        <button id="btn-add-kit" class="flex items-center gap-1.5 bg-orange-500 text-white hover:bg-orange-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all">
                            <i data-lucide="plus" class="w-4 h-4"></i> Create Kit
                        </button>
                    </div>
                    <div id="kits-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Kits populated dynamically -->
                    </div>
                </div>

                <!-- SUB-TAB 3: TO ORDER -->
                <div id="view-order" class="space-y-4 hidden">
                    <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-orange-100 shadow-sm">
                        <div>
                            <h2 class="text-base font-bold text-slate-800">To Order List</h2>
                            <p class="text-xs text-slate-500">Items queued for purchase and Fiji delivery</p>
                        </div>
                        <button id="btn-add-manual-order" class="flex items-center gap-1.5 bg-orange-50 text-orange-700 hover:bg-orange-100 border border-orange-200 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold">
                            <i data-lucide="plus" class="w-4 h-4"></i> Add Manual
                        </button>
                    </div>
                    <div class="bg-white rounded-2xl border border-orange-100 shadow-sm overflow-hidden">
                        <div id="order-list" class="divide-y divide-orange-50">
                            <!-- Order items populated dynamically -->
                        </div>
                    </div>
                </div>

                <!-- SUB-TAB 4: LOCATIONS -->
                <div id="view-locations" class="space-y-4 hidden">
                    <div id="locations-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <!-- Locations populated dynamically -->
                    </div>
                </div>

            </section>

            <!-- SECTION 2: SEVA TRIPS -->
            <section id="section-trips" class="space-y-6 hidden">
                <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-orange-100 shadow-sm">
                    <div>
                        <h2 class="text-base sm:text-lg font-bold text-slate-800">Fiji Volunteer Trips</h2>
                        <p class="text-xs text-slate-500">Sorted by departure priority</p>
                    </div>
                    <button id="btn-add-trip" class="flex items-center gap-1.5 bg-orange-500 text-white hover:bg-orange-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all">
                        <i data-lucide="plus" class="w-4 h-4"></i> Add Trip
                    </button>
                </div>
                <div id="trips-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Trips populated dynamically -->
                </div>
            </section>

        </main>
    </div>

    <!-- MODAL 1: ADD/EDIT ITEM -->
    <div id="modal-item" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-2xl shadow-xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="px-6 py-4 border-b border-orange-100 flex justify-between items-center bg-orange-50/50">
                <h3 id="modal-item-title" class="font-bold text-slate-800">Add Inventory Item</h3>
                <button class="close-modal text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="form-item" class="p-6 space-y-4 overflow-y-auto">
                <input type="hidden" id="item-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Item Name *</label>
                    <input type="text" id="item-name" required class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Category *</label>
                        <select id="item-category" required class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Location *</label>
                        <input type="text" id="item-location" placeholder="e.g. Cupboard B" required class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Current Quantity</label>
                        <input type="number" id="item-qty" min="0" value="0" required class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Min Threshold</label>
                        <input type="number" id="item-min" min="0" value="1" required class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
                    </div>
                </div>
                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" class="close-modal px-4 py-2 text-xs sm:text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-xs sm:text-sm font-semibold bg-orange-500 text-white rounded-xl hover:bg-orange-600">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL 2: CATEGORIES MANAGER -->
    <div id="modal-categories" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl shadow-xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="px-6 py-4 border-b border-orange-100 flex justify-between items-center bg-orange-50/50">
                <h3 class="font-bold text-slate-800">Manage Custom Categories</h3>
                <button class="close-modal text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-6 space-y-4 overflow-y-auto">
                <form id="form-add-cat" class="flex gap-2">
                    <input type="text" id="new-cat-name" placeholder="New Category Name" required class="flex-1 px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
                    <button type="submit" class="bg-orange-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold hover:bg-orange-600">Add</button>
                </form>
                <div id="categories-list" class="divide-y divide-slate-100 max-h-60 overflow-y-auto">
                    <!-- Categories listed here -->
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL 3: KIT BUILDER & EDIT CONTENTS -->
    <div id="modal-kit" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-2xl shadow-xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="px-6 py-4 border-b border-orange-100 flex justify-between items-center bg-orange-50/50">
                <h3 id="modal-kit-title" class="font-bold text-slate-800">Kit Configuration</h3>
                <button class="close-modal text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="form-kit" class="p-6 space-y-4 overflow-y-auto">
                <input type="hidden" id="kit-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Kit Name *</label>
                    <input type="text" id="kit-name" placeholder="e.g. Ghar Sabha Kit" required class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Kit Items & Quantities</label>
                    <div id="kit-items-selector" class="space-y-2 max-h-56 overflow-y-auto p-2 bg-slate-50 rounded-xl border border-slate-200">
                        <!-- Selectable inventory items -->
                    </div>
                </div>
                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" class="close-modal px-4 py-2 text-xs sm:text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-xs sm:text-sm font-semibold bg-orange-500 text-white rounded-xl hover:bg-orange-600">Save Kit</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL 4: SEVA TRIP -->
    <div id="modal-trip" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl shadow-xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="px-6 py-4 border-b border-orange-100 flex justify-between items-center bg-orange-50/50">
                <h3 class="font-bold text-slate-800">Log Seva Trip</h3>
                <button class="close-modal text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="form-trip" class="p-6 space-y-4 overflow-y-auto">
                <input type="hidden" id="trip-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Name *</label>
                    <input type="text" id="trip-name" required placeholder="Volunteer Name" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Departure *</label>
                        <input type="date" id="trip-departure" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Return Date</label>
                        <input type="date" id="trip-return" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Ticket / Booking Details</label>
                    <textarea id="trip-details" rows="3" placeholder="Flight #, PNR, baggage info..." class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"></textarea>
                </div>
                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" class="close-modal px-4 py-2 text-xs sm:text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-xs sm:text-sm font-semibold bg-orange-500 text-white rounded-xl hover:bg-orange-600">Save Trip</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT APPLICATION LOGIC -->
    <script>
        // DATA STATE MANAGED IN LOCALSTORAGE
        let state = {
            categories: JSON.parse(localStorage.getItem('fiji_categories')) || ['Pooja Supplies', 'Mala & Kanthi', 'Murtis & Frames', 'Electronics'],
            inventory: JSON.parse(localStorage.getItem('fiji_inventory')) || [],
            kits: JSON.parse(localStorage.getItem('fiji_kits')) || [],
            orders: JSON.parse(localStorage.getItem('fiji_orders')) || [],
            trips: JSON.parse(localStorage.getItem('fiji_trips')) || []
        };

        function saveData() {
            localStorage.setItem('fiji_categories', JSON.stringify(state.categories));
            localStorage.setItem('fiji_inventory', JSON.stringify(state.inventory));
            localStorage.setItem('fiji_kits', JSON.stringify(state.kits));
            localStorage.setItem('fiji_orders', JSON.stringify(state.orders));
            localStorage.setItem('fiji_trips', JSON.stringify(state.trips));
            renderAll();
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-slate-800 text-white text-xs sm:text-sm px-4 py-2.5 rounded-xl shadow-lg border border-slate-700 transition-all transform translate-y-2 opacity-0 flex items-center gap-2';
            toast.innerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4 text-orange-400"></i> ${msg}`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // INITIALIZATION & EVENT LISTENERS
        document.addEventListener('DOMContentLoaded', () => {
            setupNavigation();
            setupModals();
            setupForms();
            setupImportExport();
            renderAll();
            lucide.createIcons();
        });

        // SIDEBAR & TAB NAVIGATION
        function setupNavigation() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const toggleBtn = document.getElementById('toggle-sidebar');

            function toggleSidebar() {
                sidebar.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
            }

            toggleBtn.addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', toggleSidebar);

            // Module switching
            document.getElementById('nav-stock').addEventListener('click', () => {
                showModule('stock');
                if (window.innerWidth < 768) toggleSidebar();
            });
            document.getElementById('nav-trips').addEventListener('click', () => {
                showModule('trips');
                if (window.innerWidth < 768) toggleSidebar();
            });

            // Stock Sub-tabs
            const tabs = ['inventory', 'kits', 'order', 'locations'];
            tabs.forEach(t => {
                document.getElementById(`tab-${t}`).addEventListener('click', (e) => {
                    document.querySelectorAll('.stock-tab').forEach(btn => {
                        btn.classList.remove('active', 'text-orange-600', 'border-orange-500');
                        btn.classList.add('text-slate-500', 'border-transparent');
                    });
                    e.currentTarget.classList.add('active', 'text-orange-600', 'border-orange-500');
                    e.currentTarget.classList.remove('text-slate-500', 'border-transparent');

                    tabs.forEach(v => document.getElementById(`view-${v}`).classList.add('hidden'));
                    document.getElementById(`view-${t}`).classList.remove('hidden');
                });
            });

            // Search and Category Filter
            document.getElementById('search-inventory').addEventListener('input', renderInventory);
            document.getElementById('filter-category').addEventListener('change', renderInventory);
        }

        function showModule(mod) {
            if (mod === 'stock') {
                document.getElementById('section-stock').classList.remove('hidden');
                document.getElementById('section-trips').classList.add('hidden');
                document.getElementById('nav-stock').className = "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm text-orange-700 bg-orange-100/70 border border-orange-200/50 transition-all";
                document.getElementById('nav-trips').className = "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm text-slate-600 hover:bg-orange-50 hover:text-orange-600 transition-all";
            } else {
                document.getElementById('section-stock').classList.add('hidden');
                document.getElementById('section-trips').classList.remove('hidden');
                document.getElementById('nav-trips').className = "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm text-orange-700 bg-orange-100/70 border border-orange-200/50 transition-all";
                document.getElementById('nav-stock').className = "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm text-slate-600 hover:bg-orange-50 hover:text-orange-600 transition-all";
            }
        }

        // MODAL MANAGEMENT
        function setupModals() {
            document.querySelectorAll('.close-modal').forEach(b => {
                b.addEventListener('click', () => {
                    document.querySelectorAll('[id^="modal-"]').forEach(m => m.classList.add('hidden'));
                });
            });

            document.getElementById('btn-add-item').addEventListener('click', () => openItemModal());
            document.getElementById('btn-manage-cat').addEventListener('click', openCatModal);
            document.getElementById('btn-add-kit').addEventListener('click', () => openKitModal());
            document.getElementById('btn-add-trip').addEventListener('click', () => openTripModal());
            document.getElementById('btn-add-manual-order').addEventListener('click', addManualOrderPrompt);
        }

        function openItemModal(item = null) {
            document.getElementById('form-item').reset();
            const catSelect = document.getElementById('item-category');
            catSelect.innerHTML = state.categories.map(c => `<option value="${c}">${c}</option>`).join('');

            if (item) {
                document.getElementById('modal-item-title').innerText = "Edit Item";
                document.getElementById('item-id').value = item.id;
                document.getElementById('item-name').value = item.name;
                document.getElementById('item-category').value = item.category;
                document.getElementById('item-location').value = item.location;
                document.getElementById('item-qty').value = item.qty;
                document.getElementById('item-min').value = item.min;
            } else {
                document.getElementById('modal-item-title').innerText = "Add Inventory Item";
                document.getElementById('item-id').value = "";
            }
            document.getElementById('modal-item').classList.remove('hidden');
        }

        function openCatModal() {
            renderCatList();
            document.getElementById('modal-categories').classList.remove('hidden');
        }

        function openKitModal(kit = null) {
            document.getElementById('form-kit').reset();
            const container = document.getElementById('kit-items-selector');
            
            if (state.inventory.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 p-2">Add inventory items first before building a kit.</p>`;
            } else {
                container.innerHTML = state.inventory.map(inv => {
                    const existingQty = kit && kit.items ? (kit.items.find(i => i.id === inv.id)?.qty || 0) : 0;
                    return `
                        <div class="flex justify-between items-center bg-white p-2 rounded-lg border border-slate-200">
                            <span class="text-xs font-semibold text-slate-700">${inv.name}</span>
                            <input type="number" min="0" data-item-id="${inv.id}" value="${existingQty}" class="kit-item-input w-16 px-2 py-1 text-xs border border-slate-200 rounded text-center">
                        </div>
                    `;
                }).join('');
            }

            if (kit) {
                document.getElementById('modal-kit-title').innerText = "Edit Kit";
                document.getElementById('kit-id').value = kit.id;
                document.getElementById('kit-name').value = kit.name;
            } else {
                document.getElementById('modal-kit-title').innerText = "Create Kit Assembly";
                document.getElementById('kit-id').value = "";
            }
            document.getElementById('modal-kit').classList.remove('hidden');
        }

        function openTripModal(trip = null) {
            document.getElementById('form-trip').reset();
            if (trip) {
                document.getElementById('trip-id').value = trip.id;
                document.getElementById('trip-name').value = trip.name;
                document.getElementById('trip-departure').value = trip.departure;
                document.getElementById('trip-return').value = trip.returnDate || '';
                document.getElementById('trip-details').value = trip.details || '';
            } else {
                document.getElementById('trip-id').value = "";
            }
            document.getElementById('modal-trip').classList.remove('hidden');
        }

        // FORMS SUBMISSION
        function setupForms() {
            // Save Item
            document.getElementById('form-item').addEventListener('submit', (e) => {
                e.preventDefault();
                const id = document.getElementById('item-id').value || Date.now().toString();
                const item = {
                    id,
                    name: document.getElementById('item-name').value,
                    category: document.getElementById('item-category').value,
                    location: document.getElementById('item-location').value,
                    qty: parseInt(document.getElementById('item-qty').value) || 0,
                    min: parseInt(document.getElementById('item-min').value) || 0
                };

                const idx = state.inventory.findIndex(i => i.id === id);
                if (idx > -1) state.inventory[idx] = item;
                else state.inventory.push(item);

                saveData();
                document.getElementById('modal-item').classList.add('hidden');
                showToast(idx > -1 ? "Item updated" : "New item added");
            });

            // Save Category
            document.getElementById('form-add-cat').addEventListener('submit', (e) => {
                e.preventDefault();
                const val = document.getElementById('new-cat-name').value.trim();
                if (val && !state.categories.includes(val)) {
                    state.categories.push(val);
                    saveData();
                    renderCatList();
                    document.getElementById('new-cat-name').value = "";
                    showToast("Category added");
                }
            });

            // Save Kit
            document.getElementById('form-kit').addEventListener('submit', (e) => {
                e.preventDefault();
                const id = document.getElementById('kit-id').value || Date.now().toString();
                const kitName = document.getElementById('kit-name').value;
                
                const selectedItems = [];
                document.querySelectorAll('.kit-item-input').forEach(inp => {
                    const q = parseInt(inp.value) || 0;
                    if (q > 0) {
                        selectedItems.push({ id: inp.dataset.itemId, qty: q });
                    }
                });

                const existingKit = state.kits.find(k => k.id === id);
                const kit = {
                    id,
                    name: kitName,
                    count: existingKit ? existingKit.count : 0,
                    items: selectedItems
                };

                const idx = state.kits.findIndex(k => k.id === id);
                if (idx > -1) state.kits[idx] = kit;
                else state.kits.push(kit);

                saveData();
                document.getElementById('modal-kit').classList.add('hidden');
                showToast("Kit saved");
            });

            // Save Trip
            document.getElementById('form-trip').addEventListener('submit', (e) => {
                e.preventDefault();
                const id = document.getElementById('trip-id').value || Date.now().toString();
                const trip = {
                    id,
                    name: document.getElementById('trip-name').value,
                    departure: document.getElementById('trip-departure').value,
                    returnDate: document.getElementById('trip-return').value,
                    details: document.getElementById('trip-details').value
                };

                const idx = state.trips.findIndex(t => t.id === id);
                if (idx > -1) state.trips[idx] = trip;
                else state.trips.push(trip);

                saveData();
                document.getElementById('modal-trip').classList.add('hidden');
                showToast("Seva trip logged");
            });
        }

        // RENDER FUNCTIONS
        function renderAll() {
            renderInventory();
            renderKits();
            renderOrders();
            renderLocations();
            renderTrips();
            updateCategoryDropdowns();
            lucide.createIcons();
        }

        function updateCategoryDropdowns() {
            const filter = document.getElementById('filter-category');
            const currentVal = filter.value;
            filter.innerHTML = `<option value="ALL">All Categories</option>` + 
                state.categories.map(c => `<option value="${c}">${c}</option>`).join('');
            filter.value = currentVal;
        }

        function renderCatList() {
            const list = document.getElementById('categories-list');
            list.innerHTML = state.categories.map(c => `
                <div class="flex justify-between items-center py-2">
                    <span class="text-xs font-semibold text-slate-700">${c}</span>
                    <button onclick="deleteCategory('${c}')" class="text-rose-500 hover:text-rose-700 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.deleteCategory = function(cat) {
            state.categories = state.categories.filter(c => c !== cat);
            saveData();
            renderCatList();
        }

        function renderInventory() {
            const search = document.getElementById('search-inventory').value.toLowerCase();
            const catFilter = document.getElementById('filter-category').value;
            const container = document.getElementById('inventory-list');

            const filtered = state.inventory.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(search) || item.location.toLowerCase().includes(search);
                const matchesCat = catFilter === 'ALL' || item.category === catFilter;
                return matchesSearch && matchesCat;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-slate-400 py-8">No inventory items found.</p>`;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const isLow = item.qty <= item.min;
                return `
                    <div class="p-4 sm:flex sm:items-center sm:justify-between gap-4">
                        <div class="flex-1 space-y-1 mb-3 sm:mb-0">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-slate-800 text-sm sm:text-base">${item.name}</span>
                                ${isLow ? `<span class="bg-rose-100 text-rose-700 text-[10px] px-2 py-0.5 rounded-full font-bold">Low Stock</span>` : ''}
                            </div>
                            <div class="flex items-center gap-3 text-xs text-slate-500">
                                <span>Category: <strong class="text-slate-700">${item.category}</strong></span>
                                <span>•</span>
                                <span>Location: <strong class="text-slate-700">${item.location}</strong></span>
                            </div>
                        </div>

                        <div class="flex items-center justify-between sm:justify-end gap-3 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100">
                            <!-- Quantity Adjuster -->
                            <div class="flex items-center bg-slate-100 rounded-xl p-1">
                                <button onclick="adjustQty('${item.id}', -1)" class="w-7 h-7 flex items-center justify-center bg-white text-slate-700 rounded-lg shadow-sm font-bold text-sm active:scale-95">-</button>
                                <span class="w-10 text-center font-bold text-xs sm:text-sm text-slate-800">${item.qty}</span>
                                <button onclick="adjustQty('${item.id}', 1)" class="w-7 h-7 flex items-center justify-center bg-white text-slate-700 rounded-lg shadow-sm font-bold text-sm active:scale-95">+</button>
                            </div>

                            <!-- Order + Button -->
                            <button onclick="addToOrder('${item.id}')" class="flex items-center gap-1 bg-orange-50 hover:bg-orange-100 text-orange-700 border border-orange-200 px-3 py-1.5 rounded-xl text-xs font-semibold active:scale-95">
                                <i data-lucide="shopping-cart" class="w-3.5 h-3.5"></i> Order +
                            </button>

                            <!-- Actions -->
                            <div class="flex items-center gap-1">
                                <button onclick="editItem('${item.id}')" class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                <button onclick="deleteItem('${item.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        window.adjustQty = function(id, delta) {
            const item = state.inventory.find(i => i.id === id);
            if (item) {
                item.qty = Math.max(0, item.qty + delta);
                saveData();
            }
        };

        window.addToOrder = function(id) {
            const item = state.inventory.find(i => i.id === id);
            if (item) {
                const existing = state.orders.find(o => o.itemId === id);
                if (existing) existing.qty += 1;
                else state.orders.push({ id: Date.now().toString(), itemId: id, name: item.name, qty: 1 });
                saveData();
                showToast(`Added ${item.name} to Order List`);
            }
        };

        window.editItem = function(id) {
            const item = state.inventory.find(i => i.id === id);
            if (item) openItemModal(item);
        };

        window.deleteItem = function(id) {
            if (confirm("Delete this inventory item?")) {
                state.inventory = state.inventory.filter(i => i.id !== id);
                saveData();
                showToast("Item deleted");
            }
        };

        function renderKits() {
            const container = document.getElementById('kits-container');
            if (state.kits.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-xs text-slate-400 py-8 bg-white rounded-2xl border border-orange-100">No kit assemblies created yet.</p>`;
                return;
            }

            container.innerHTML = state.kits.map(kit => {
                const itemDetails = (kit.items || []).map(ki => {
                    const inv = state.inventory.find(i => i.id === ki.id);
                    return inv ? `<li class="text-xs text-slate-600 flex justify-between"><span>${inv.name}</span><strong class="text-slate-800">x${ki.qty}</strong></li>` : '';
                }).join('');

                return `
                    <div class="bg-white p-5 rounded-2xl border border-orange-100 shadow-sm space-y-4">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-slate-800 text-base">${kit.name}</h3>
                                <p class="text-xs text-slate-400">${(kit.items || []).length} bundled items</p>
                            </div>
                            <div class="flex gap-1">
                                <button onclick="editKit('${kit.id}')" class="p-1.5 text-slate-400 hover:text-slate-600"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                <button onclick="deleteKit('${kit.id}')" class="p-1.5 text-slate-400 hover:text-rose-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>

                        <!-- Kit Contents Expandable/Visible -->
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <p class="text-[10px] font-bold text-orange-500 uppercase tracking-wider mb-1.5">Contents per kit</p>
                            <ul class="space-y-1">${itemDetails || '<li class="text-xs text-slate-400">No items configured</li>'}</ul>
                        </div>

                        <div class="flex justify-between items-center pt-2 border-t border-slate-100">
                            <span class="text-xs font-semibold text-slate-600">Assembled Stock:</span>
                            <div class="flex items-center bg-slate-100 rounded-xl p-1">
                                <button onclick="adjustKitCount('${kit.id}', -1)" class="w-7 h-7 flex items-center justify-center bg-white text-slate-700 rounded-lg shadow-sm font-bold text-sm active:scale-95">-</button>
                                <span class="w-10 text-center font-bold text-xs sm:text-sm text-slate-800">${kit.count || 0}</span>
                                <button onclick="adjustKitCount('${kit.id}', 1)" class="w-7 h-7 flex items-center justify-center bg-white text-slate-700 rounded-lg shadow-sm font-bold text-sm active:scale-95">+</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        window.adjustKitCount = function(id, delta) {
            const kit = state.kits.find(k => k.id === id);
            if (kit) {
                kit.count = Math.max(0, (kit.count || 0) + delta);
                saveData();
            }
        };

        window.editKit = function(id) {
            const kit = state.kits.find(k => k.id === id);
            if (kit) openKitModal(kit);
        };

        window.deleteKit = function(id) {
            if (confirm("Delete this kit assembly?")) {
                state.kits = state.kits.filter(k => k.id !== id);
                saveData();
                showToast("Kit deleted");
            }
        };

        function renderOrders() {
            const container = document.getElementById('order-list');
            const badge = document.getElementById('badge-order-count');

            if (state.orders.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-slate-400 py-8">No items currently queued for ordering.</p>`;
                badge.classList.add('hidden');
                return;
            }

            badge.innerText = state.orders.length;
            badge.classList.remove('hidden');

            container.innerHTML = state.orders.map(order => `
                <div class="p-4 flex items-center justify-between gap-3">
                    <div class="flex-1">
                        <span class="font-bold text-slate-800 text-sm sm:text-base">${order.name}</span>
                        <p class="text-xs text-slate-500">Order Quantity: <strong class="text-orange-600">${order.qty}</strong></p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="deliverOrder('${order.id}')" class="flex items-center gap-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-xl text-xs font-semibold hover:bg-emerald-100 transition-all active:scale-95">
                            <i data-lucide="check" class="w-3.5 h-3.5"></i> Delivered
                        </button>
                        <button onclick="deleteOrder('${order.id}')" class="p-1.5 text-slate-400 hover:text-rose-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.deliverOrder = function(orderId) {
            const order = state.orders.find(o => o.id === orderId);
            if (order) {
                // Add quantity back to inventory if matched
                if (order.itemId) {
                    const inv = state.inventory.find(i => i.id === order.itemId);
                    if (inv) inv.qty += order.qty;
                }
                state.orders = state.orders.filter(o => o.id !== orderId);
                saveData();
                showToast(`Delivered! Added ${order.qty} back to stock.`);
            }
        };

        window.deleteOrder = function(orderId) {
            state.orders = state.orders.filter(o => o.id !== orderId);
            saveData();
        };

        function addManualOrderPrompt() {
            const name = prompt("Enter item name to order:");
            if (name) {
                const qty = parseInt(prompt("Enter order quantity:", "1")) || 1;
                state.orders.push({ id: Date.now().toString(), itemId: null, name, qty });
                saveData();
                showToast("Manual order item added");
            }
        }

        function renderLocations() {
            const container = document.getElementById('locations-grid');
            const locationsMap = {};

            state.inventory.forEach(item => {
                const loc = item.location || 'Unassigned';
                if (!locationsMap[loc]) locationsMap[loc] = [];
                locationsMap[loc].push(item);
            });

            const keys = Object.keys(locationsMap);
            if (keys.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-xs text-slate-400 py-8 bg-white rounded-2xl border border-orange-100">No storage locations assigned yet.</p>`;
                return;
            }

            container.innerHTML = keys.map(loc => `
                <div class="bg-white p-5 rounded-2xl border border-orange-100 shadow-sm space-y-3">
                    <div class="flex items-center gap-2 border-b border-orange-50 pb-2">
                        <i data-lucide="map-pin" class="w-4 h-4 text-orange-500"></i>
                        <h3 class="font-bold text-slate-800 text-sm sm:text-base">${loc}</h3>
                    </div>
                    <ul class="space-y-2 divide-y divide-slate-50">
                        ${locationsMap[loc].map(i => `
                            <li class="pt-2 flex justify-between items-center text-xs">
                                <span class="text-slate-700 font-medium">${i.name}</span>
                                <span class="bg-orange-50 text-orange-700 px-2 py-0.5 rounded-full font-bold">${i.qty}</span>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function renderTrips() {
            const container = document.getElementById('trips-container');
            if (state.trips.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-xs text-slate-400 py-8 bg-white rounded-2xl border border-orange-100">No upcoming Seva trips logged.</p>`;
                return;
            }

            // Priority sorting: Soonest departure first
            const sortedTrips = [...state.trips].sort((a, b) => new Date(a.departure) - new Date(b.departure));
            const now = new Date();

            container.innerHTML = sortedTrips.map(trip => {
                const depDate = new Date(trip.departure);
                const diffDays = Math.ceil((depDate - now) / (1000 * 60 * 60 * 24));
                const isSoon = diffDays >= 0 && diffDays <= 14;

                return `
                    <div class="bg-white p-5 rounded-2xl border border-orange-100 shadow-sm space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="flex items-center gap-2">
                                    <h3 class="font-bold text-slate-800 text-base">${trip.name}</h3>
                                    ${isSoon ? `<span class="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded-full font-bold">Departing Soon</span>` : ''}
                                </div>
                                <p class="text-xs text-slate-500 mt-0.5">Departure: <strong class="text-slate-800">${trip.departure}</strong> ${trip.returnDate ? `| Return: <strong class="text-slate-800">${trip.returnDate}</strong>` : ''}</p>
                            </div>
                            <div class="flex gap-1">
                                <button onclick="editTrip('${trip.id}')" class="p-1.5 text-slate-400 hover:text-slate-600"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                <button onclick="deleteTrip('${trip.id}')" class="p-1.5 text-slate-400 hover:text-rose-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>

                        ${trip.details ? `
                            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-xs text-slate-600">
                                <strong class="text-slate-700 block mb-1">Ticket / Booking Info:</strong>
                                ${trip.details}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        window.editTrip = function(id) {
            const trip = state.trips.find(t => t.id === id);
            if (trip) openTripModal(trip);
        };

        window.deleteTrip = function(id) {
            if (confirm("Delete this trip log?")) {
                state.trips = state.trips.filter(t => t.id !== id);
                saveData();
                showToast("Trip deleted");
            }
        };

        // EXPORT & IMPORT DATA
        function setupImportExport() {
            document.getElementById('btn-export').addEventListener('click', () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `fiji_admin_backup_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                showToast("Backup downloaded");
            });

            document.getElementById('btn-import-trigger').addEventListener('click', () => {
                document.getElementById('file-import').click();
            });

            document.getElementById('file-import').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const imported = JSON.parse(evt.target.result);
                        if (imported) {
                            state.categories = imported.categories || state.categories;
                            state.inventory = imported.inventory || state.inventory;
                            state.kits = imported.kits || state.kits;
                            state.orders = imported.orders || state.orders;
                            state.trips = imported.trips || state.trips;
                            saveData();
                            showToast("Data imported successfully!");
                        }
                    } catch (err) {
                        alert("Invalid backup JSON file.");
                    }
                };
                reader.readAsText(file);
            });
        }
    </script>
</body>
</html>
